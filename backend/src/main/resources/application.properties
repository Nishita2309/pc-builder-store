spring.application.name=backend

# =========================
# DATABASE CONFIGURATION
# =========================
spring.datasource.url=jdbc:h2:mem:pcbuilderstore;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=false
spring.datasource.username=root
spring.datasource.password=23Nishita2005*
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =========================
# JPA / HIBERNATE CONFIGURATION
# =========================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# =========================
# SERVER
# =========================
server.port=8080
server.servlet.context-path=/

# =========================
# JWT
# =========================
# NOTE: Replace with a securely generated 256-bit Base64 key before deploying to production
jwt.secret=ReplaceThisWithALongRandom256BitSecretKeyForDevelopmentOnly123456789
jwt.expiration=3600000

# =========================
# SWAGGER / OPENAPI
# =========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# =========================
# LOGGING
# =========================
logging.level.root=INFO
logging.level.com.pcbuilderstore=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized