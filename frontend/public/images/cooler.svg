<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="rgbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  
  <!-- Radiator -->
  <rect x="50" y="40" width="300" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <line x1="50" y1="60" x2="350" y2="60" stroke="#475569" stroke-width="15" stroke-dasharray="2 3" opacity="0.3" />
  
  <!-- Cooler Fans -->
  <g transform="translate(85, 45)">
    <circle cx="40" cy="15" r="14" fill="none" stroke="url(#rgbGrad)" stroke-width="2.5" />
    <circle cx="115" cy="15" r="14" fill="none" stroke="url(#rgbGrad)" stroke-width="2.5" />
    <circle cx="190" cy="15" r="14" fill="none" stroke="url(#rgbGrad)" stroke-width="2.5" />
  </g>
  
  <!-- Liquid Tubes -->
  <path d="M320,80 C320,150 260,180 230,180" fill="none" stroke="#0f172a" stroke-width="12" />
  <path d="M320,80 C320,150 260,180 230,180" fill="none" stroke="#1e293b" stroke-width="8" />
  <path d="M330,80 C330,140 270,170 240,170" fill="none" stroke="#0f172a" stroke-width="12" />
  <path d="M330,80 C330,140 270,170 240,170" fill="none" stroke="#1e293b" stroke-width="8" />

  <!-- CPU Pump Block -->
  <g transform="translate(140, 150)">
    <rect x="0" y="0" width="80" height="80" rx="40" fill="#0f172a" stroke="#334155" stroke-width="3" />
    <circle cx="40" cy="40" r="30" fill="none" stroke="url(#rgbGrad)" stroke-width="4" />
    <text x="40" y="44" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">38°C</text>
  </g>
</svg>
