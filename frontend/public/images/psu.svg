<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  
  <!-- PSU Chassis -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="200" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="3" />
    
    <!-- Fan Grill circle -->
    <circle cx="100" cy="90" r="70" fill="#0f172a" stroke="url(#neonGrad)" stroke-width="2" />
    
    <!-- Fan Blades -->
    <path d="M100,20 L100,160 M20,90 L180,90 M43,33 L157,147 M43,147 L157,33" stroke="#334155" stroke-width="8" stroke-linecap="round" opacity="0.3" />
    
    <!-- Grill spirals -->
    <circle cx="100" cy="90" r="50" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 5" />
    <circle cx="100" cy="90" r="30" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="100" cy="90" r="10" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    
    <!-- Gold Wattage text label -->
    <rect x="30" y="145" width="140" height="25" rx="5" fill="#0f172a" stroke="#eab308" stroke-width="1.5" />
    <text x="100" y="162" fill="#eab308" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">850W GOLD MODULAR</text>
  </g>
</svg>
