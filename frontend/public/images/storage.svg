<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  
  <!-- SSD Board -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="280" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="2" y="2" width="276" height="76" rx="6" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.8" />
    
    <!-- Gold connectors -->
    <g transform="translate(10, 15)">
      <rect x="0" y="0" width="2" height="15" fill="#eab308" />
      <rect x="5" y="0" width="2" height="15" fill="#eab308" />
      <rect x="10" y="0" width="2" height="15" fill="#eab308" />
      <rect x="15" y="0" width="2" height="15" fill="#eab308" />
      <rect x="20" y="0" width="2" height="15" fill="#eab308" />
      <rect x="25" y="0" width="2" height="15" fill="#eab308" />
      <rect x="30" y="0" width="2" height="15" fill="#eab308" />
      <rect x="35" y="0" width="2" height="15" fill="#eab308" />
      <rect x="40" y="0" width="2" height="15" fill="#eab308" />
    </g>
    
    <!-- NAND Chips -->
    <rect x="80" y="15" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <rect x="140" y="15" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <rect x="200" y="15" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    
    <!-- Controller -->
    <rect x="35" y="40" width="30" height="30" rx="2" fill="#020617" stroke="#475569" />
    
    <!-- Tech pathways -->
    <path d="M65,55 L80,55" stroke="#8b5cf6" stroke-width="2" opacity="0.6" />
    <path d="M130,40 L140,40" stroke="#3b82f6" stroke-width="2" opacity="0.6" />
    <path d="M190,40 L200,40" stroke="#3b82f6" stroke-width="2" opacity="0.6" />
  </g>
</svg>
